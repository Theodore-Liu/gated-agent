[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-agent"
version = "0.1.0"
description = "An options agent that red-teams its own risk exposure before every order (Alpaca AI Trading Agents Hackathon)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
